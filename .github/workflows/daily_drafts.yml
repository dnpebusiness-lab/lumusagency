name: Lumus Daily Gmail Drafts

on:
  schedule:
    - cron: '0 6 * * 1-5'   # Mon–Fri at 06:00 UTC = 07:00 Irish time (BST)
  workflow_dispatch:          # Manual trigger from GitHub UI

jobs:
  run-and-draft:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
      GMAIL_CLIENT_ID:       ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET:   ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN:   ${{ secrets.GMAIL_REFRESH_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Find and score leads
        run: python3 orchestrator.py

      - name: Create Gmail drafts (email outreach)
        run: python3 scripts/06_create_gmail_drafts.py

      - name: Send Instagram DM brief
        run: python3 scripts/07_send_dm_brief.py

      - name: Commit and push results
        run: |
          git config user.name "lumus-agent"
          git config user.email "agent@lumusagency.ie"
          git add leads/ reports/ outreach/drafts/ data/
          git diff --cached --quiet || git commit -m "Daily lead run — $(date +'%Y-%m-%d')"
          git push
