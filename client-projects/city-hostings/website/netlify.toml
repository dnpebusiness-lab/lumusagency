[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "10"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Booking provider (set in Netlify dashboard, not here)
# NEXT_PUBLIC_BOOKING_PROVIDER_URL
# NEXT_PUBLIC_BOOKING_WIDGET_SCRIPT
# BOOKING_API_ENDPOINT
# NEXT_PUBLIC_BOOKING_PUBLIC_KEY

# Forms
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
