# =============================================================================
# Supabase local development configuration
# =============================================================================
# Used by `supabase start` / `supabase db reset`, which require Docker.
# When Docker is unavailable, scripts/db-local.sh applies the same migrations
# and seed to a plain PostgreSQL server instead. See SUPABASE_SETUP.md.
# =============================================================================

project_id = "astra-voice"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
# The "agent" schema is deliberately NOT exposed through the API. It is the
# approved-data-only surface and is reached from server-side code with the
# service role, never from a browser.
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Supabase hosted projects currently run PostgreSQL 15/17. Local validation for
# Milestone 2 ran on PostgreSQL 16.13; nothing in the schema uses a version
# specific feature, but this is called out in SUPABASE_SETUP.md.
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# V1 ships email + password. Magic link is prepared but disabled: see
# ASSUMPTIONS.md A-50 and PRD §Authentication.
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.email.template.recovery]
subject = "Reset your Astra Voice password"

[analytics]
enabled = false
